

```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Telugu Movies</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    color: white;
    background:
      linear-gradient(rgba(10,10,25,.85),rgba(10,10,25,.9)),
      url("{{ url_for('static', filename='friendship-bg.jpg') }}");
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
}

header {
    text-align: center;
    padding: 30px 15px;
    background: #17132b;
}

header h1 {
    color: #c4b5fd;
}

.search {
    display: block;
    width: 90%;
    max-width: 500px;
    padding: 14px;
    margin: 25px auto;
    border-radius: 25px;
    border: 2px solid #a78bfa;
    font-size: 16px;
}

.container {
    max-width: 1200px;
    margin: auto;
    padding: 20px;
}

.movie-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit,minmax(190px,1fr));
    gap: 22px;
}

.movie-card {
    background: #252040;
    border: 1px solid #8b5cf6;
    border-radius: 15px;
    overflow: hidden;
    text-align: center;
    padding-bottom: 18px;
    transition: .3s;
}

.movie-card:hover {
    transform: translateY(-7px);
    box-shadow: 0 5px 20px #8b5cf6;
}

.poster {
    height: 180px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 65px;
    background: linear-gradient(135deg,#312e81,#7e22ce);
}

.movie-card h3 {
    color: #e9d5ff;
    padding: 10px;
    min-height: 55px;
}

.download {
    display: inline-block;
    padding: 11px 20px;
    background: #16a34a;
    color: white;
    text-decoration: none;
    border-radius: 8px;
    font-weight: bold;
}

.download:hover {
    background: #15803d;
}

.back {
    display: inline-block;
    margin: 30px;
    padding: 12px 25px;
    background: #8b5cf6;
    color: white;
    text-decoration: none;
    border-radius: 20px;
}
</style>
</head>

<body>

<header>
    <h1>🎬 Telugu Movies Collection</h1>
    <p>Explore Your Favourite Movies</p>
</header>

<input
    class="search"
    id="search"
    type="text"
    placeholder="🔍 Search Movies..."
    oninput="searchMovies()"
>

<div class="container">
    <div class="movie-grid">

        {% for movie in movies %}

        <div class="movie-card">
            <div class="poster">🎬</div>

            <h3>{{ movie }}</h3>

            <a href="#"
               class="download"
               onclick="alert('Movie file is not available yet.'); return false;">
               ⬇ Download
            </a>
        </div>

        {% endfor %}

    </div>

    <center>
        <a href="/" class="back">⬅ Back to Home</a>
    </center>
</div>

<script>
function searchMovies() {
    let value = document.getElementById("search").value.toLowerCase();

    document.querySelectorAll(".movie-card").forEach(card => {
        card.style.display =
            card.innerText.toLowerCase().includes(value)
            ? "block" : "none";
    });
}
</script>

</body>
</html>
```
