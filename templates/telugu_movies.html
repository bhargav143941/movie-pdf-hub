```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Telugu Movies | Movie & PDF Hub</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            color: white;

            background:
                linear-gradient(
                    rgba(10, 10, 25, 0.75),
                    rgba(10, 10, 25, 0.85)
                ),
                url("{{ url_for('static', filename='friendship-bg.jpg') }}");

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }

        header {
            text-align: center;
            padding: 35px 15px;
            background: rgba(15, 15, 35, 0.8);
            border-bottom: 2px solid #a78bfa;
        }

        header h1 {
            color: #c4b5fd;
            font-size: 36px;
            margin-bottom: 10px;
        }

        header p {
            color: #e9d5ff;
            font-size: 16px;
        }

        .search-box {
            text-align: center;
            margin: 25px 15px;
        }

        .search-box input {
            width: 90%;
            max-width: 500px;
            padding: 14px;
            border-radius: 25px;
            border: 2px solid #a78bfa;
            outline: none;
            font-size: 16px;
        }

        .container {
            max-width: 1200px;
            margin: auto;
            padding: 20px;
        }

        .movie-grid {
            display: grid;
            grid-template-columns:
                repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }

        .movie-card {
            background: rgba(35, 30, 65, 0.9);
            border: 1px solid #a78bfa;
            border-radius: 15px;
            padding: 25px 15px;
            text-align: center;
            transition: 0.3s;
        }

        .movie-card:hover {
            transform: translateY(-7px);
            background: rgba(90, 60, 140, 0.95);
            box-shadow: 0 5px 20px rgba(167, 139, 250, 0.3);
        }

        .movie-card h3 {
            color: #f0abfc;
            font-size: 19px;
        }

        .back-button {
            display: inline-block;
            margin: 35px 0;
            padding: 13px 30px;
            background: #8b5cf6;
            color: white;
            text-decoration: none;
            border-radius: 25px;
            font-weight: bold;
        }

        .back-button:hover {
            background: #6d28d9;
        }

        .no-results {
            text-align: center;
            color: #fca5a5;
            margin: 25px;
            display: none;
        }

        footer {
            text-align: center;
            padding: 20px;
            background: rgba(10, 10, 25, 0.8);
            color: #c4b5fd;
        }
    </style>
</head>

<body>

    <header>
        <h1>🎬 Telugu Movies</h1>
        <p>Welcome to Your Favourite Telugu Movie Collection</p>
    </header>

    <div class="search-box">
        <input
            type="text"
            id="search"
            placeholder="🔍 Search Telugu Movies..."
            oninput="searchMovies()"
        >
    </div>

    <div class="container">

        <div class="movie-grid" id="movieGrid">

            {% for movie in movies %}

            <div class="movie-card">
                <h3>🎥 {{ movie }}</h3>
            </div>

            {% endfor %}

        </div>

        <div class="no-results" id="noResults">
            No movies found!
        </div>

        <center>
            <a href="/" class="back-button">
                ⬅ Back to Home
            </a>
        </center>

    </div>

    <footer>
        <p>❤️ Movie & PDF Hub | All Rights Reserved</p>
    </footer>

    <script>
        function searchMovies() {
            let input = document
                .getElementById("search")
                .value.toLowerCase();

            let cards = document.querySelectorAll(".movie-card");
            let count = 0;

            cards.forEach(function(card) {
                let name = card.innerText.toLowerCase();

                if (name.includes(input)) {
                    card.style.display = "block";
                    count++;
                } else {
                    card.style.display = "none";
                }
            });

            document.getElementById("noResults").style.display =
                count === 0 ? "block" : "none";
        }
    </script>

</body>
</html>
```
